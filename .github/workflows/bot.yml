name: Telegram bot 24h

# GitHub يوقف أي تشغيل بعد 6 ساعات، فالبوت يشتغل ~5:40 ساعة
# ثم يحفظ بياناته ويشغّل نفسه من جديد. الجدولة احتياط لو توقف لأي سبب.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [telegram-persona-bot]
    paths:
      - "telegram-persona-bot/**"
      - ".github/workflows/bot.yml"

# نسخة وحدة بس تشتغل بنفس الوقت (تليجرام ما يقبل نسختين)
# لو رفعت كود جديد، توقف النسخة القديمة وتشتغل الجديدة فوراً
concurrency:
  group: telegram-bot
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: telegram-persona-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-persona-bot/requirements.txt

      - name: Check secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: |
          missing=0
          for n in TELEGRAM_BOT_TOKEN OPENROUTER_API_KEY OWNER_ID; do
            if [ -z "${!n}" ]; then echo "::error::Secret $n is missing — add it in Settings > Secrets and variables > Actions > Secrets"; missing=1;
            else echo "$n: OK"; fi
          done
          [ "$missing" = 0 ] || exit 1
          # نتأكد إن OpenRouter يقبل المفتاح قبل التشغيل (بدون ما نطبع المفتاح)
          key=$(printf '%s' "$OPENROUTER_API_KEY" | tr -d '\r\n' | sed -E 's/^[[:space:]"'"'"']+//; s/[[:space:]"'"'"']+$//; s/^[Bb]earer[[:space:]]+//')
          case "$key" in
            sk-or-*) ;;
            *) echo "::warning::OPENROUTER_API_KEY ما يبدأ بـ sk-or- — غالباً منسوخ غلط أو مو مفتاح OpenRouter" ;;
          esac
          code=$(curl -s -o /tmp/key.json -w '%{http_code}' -H "Authorization: Bearer $key" https://openrouter.ai/api/v1/key)
          if [ "$code" = "404" ]; then  # المسار القديم
            code=$(curl -s -o /tmp/key.json -w '%{http_code}' -H "Authorization: Bearer $key" https://openrouter.ai/api/v1/auth/key)
          fi
          if [ "$code" != "200" ]; then
            echo "::error::OpenRouter رفض المفتاح (HTTP $code): $(head -c 300 /tmp/key.json) — انسخ مفتاح جديد من openrouter.ai/keys وحدّث السر OPENROUTER_API_KEY"
            exit 1
          fi
          echo "OpenRouter key OK: $(jq -c '.data | {limit, limit_remaining, usage, is_free_tier}' /tmp/key.json)"

      - run: pip install -r requirements.txt

      # استرجاع الهوية وذاكرة المحادثات من التشغيل السابق
      - uses: actions/cache/restore@v4
        with:
          path: telegram-persona-bot/data
          key: bot-data-${{ github.run_id }}
          restore-keys: bot-data-

      - name: Run bot
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_PROVIDER: ${{ vars.OPENROUTER_PROVIDER }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}   # اختياري: عشان البوت يكتب/يعدّل على GitHub (للمالك فقط)
        run: |
          mkdir -p data
          start=$(date +%s)
          timeout --signal=SIGINT 340m python bot.py || true
          # لو طاح بسرعة (مثلاً مفتاح غلط) لا تعيد التشغيل فوراً — الجدولة بتحاول بعد 30 دقيقة
          if [ $(( $(date +%s) - start )) -gt 300 ]; then echo "restart=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: telegram-persona-bot/data
          key: bot-data-${{ github.run_id }}-${{ github.run_attempt }}

      # حذف النسخ القديمة من البيانات عشان المحادثات الممسوحة تنحذف نهائياً
      - name: Delete old data
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: bot-data-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          keys=$(gh cache list --key bot-data- --limit 100 --json key --jq '.[].key')
          # لو ما انحفظت نسخة جديدة لا تحذف شي (عشان ما تضيع الهوية)
          echo "$keys" | grep -qx "$KEEP" || { echo "no new save, skipping"; exit 0; }
          echo "$keys" | while read -r k; do
            [ "$k" != "$KEEP" ] && gh cache delete "$k" || true
          done

      - name: Restart
        if: steps.bot.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref "${{ github.ref_name }}"

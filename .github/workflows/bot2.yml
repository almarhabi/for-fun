name: Telegram bot 2 (GLM Flash) 24h

# A second, fully independent bot running the same code (Chat + Coding, every feature) on GLM-5.3 Flash.
# Its own token, model and data (cache bot2-data-). The OpenRouter key and owner id are shared
# with bot 1 unless the _2 secrets are set.

# GitHub stops any run after 6 hours, so the bot runs ~5h40m,
# then saves its data and restarts itself. The schedule is a backup in case it stops for any reason.
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [telegram-persona-bot]
    paths:
      - "telegram-persona-bot/**"
      - ".github/workflows/bot2.yml"

permissions:
  contents: read
  actions: write

jobs:
  # When new code is pushed, the running copy is stopped first. It saves its data (persona, rules, memory,
  # projects) on the way out, and only then does the new copy start and restore that fresh save.
  # (Starting the new copy right away used to restore an older save and lose anything set since then.)
  stop-old:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Stop the running copy (it saves its data before exiting)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ids=$(gh run list --workflow bot2.yml --limit 30 --json databaseId,status \
                --jq '.[] | select(.status != "completed") | .databaseId')
          for id in $ids; do
            if [ "$id" != "${{ github.run_id }}" ]; then echo "stopping run $id"; gh run cancel "$id" || true; fi
          done

  run:
    needs: stop-old
    if: ${{ !cancelled() }}
    # Only one copy runs at a time (Telegram doesn't accept two). A new copy waits here until the old one
    # has finished saving its data — never cancel-in-progress, which would skip that save.
    concurrency:
      group: telegram-bot-2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: telegram-persona-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-persona-bot/requirements.txt

      - name: Check secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_2 || secrets.OPENROUTER_API_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID_2 || secrets.OWNER_ID }}
        run: |
          missing=0
          for n in TELEGRAM_BOT_TOKEN OPENROUTER_API_KEY OWNER_ID; do
            if [ -z "${!n}" ]; then echo "::error::Secret $n is missing (for bot 2: TELEGRAM_BOT_TOKEN_2) — add it in Settings > Secrets and variables > Actions > Secrets"; missing=1;
            else echo "$n: OK"; fi
          done
          [ "$missing" = 0 ] || exit 1
          # Make sure OpenRouter accepts the key before starting (without printing the key)
          key=$(printf '%s' "$OPENROUTER_API_KEY" | tr -d '\r\n' | sed -E 's/^[[:space:]"'"'"']+//; s/[[:space:]"'"'"']+$//; s/^[Bb]earer[[:space:]]+//')
          case "$key" in
            sk-or-*) ;;
            *) echo "::warning::OPENROUTER_API_KEY doesn't start with sk-or- — it's probably copied wrong or not an OpenRouter key" ;;
          esac
          code=$(curl -s -o /tmp/key.json -w '%{http_code}' -H "Authorization: Bearer $key" https://openrouter.ai/api/v1/key)
          if [ "$code" = "404" ]; then  # the older path
            code=$(curl -s -o /tmp/key.json -w '%{http_code}' -H "Authorization: Bearer $key" https://openrouter.ai/api/v1/auth/key)
          fi
          if [ "$code" != "200" ]; then
            echo "::error::OpenRouter rejected the key (HTTP $code): $(head -c 300 /tmp/key.json) — copy a new key from openrouter.ai/keys and update the OPENROUTER_API_KEY secret"
            exit 1
          fi
          echo "OpenRouter key OK: $(jq -c '.data | {limit, limit_remaining, usage, is_free_tier}' /tmp/key.json)"

      - run: pip install -r requirements.txt

      # Optional: run Tor inside the runner so the bot searches/reads through it.
      # Enable it by adding a variable (Variables) named USE_TOR with the value true.
      - name: Start Tor (optional)
        if: vars.USE_TOR_2 == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y tor
          sudo service tor start || (tor &)
          echo "TOR_PROXY=socks5h://127.0.0.1:9050" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/9050) >/dev/null 2>&1 && break; sleep 1; done
          echo "Tor SOCKS is ready on 9050"

      # Restore the persona, conversation memory and coding projects from the previous run
      - uses: actions/cache/restore@v4
        with:
          path: telegram-persona-bot/data
          key: bot2-data-${{ github.run_id }}
          restore-keys: bot2-data-

      - name: Run bot
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_2 || secrets.OPENROUTER_API_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID_2 || secrets.OWNER_ID }}
          # GLM-5.3 Flash (relace/fp4) is both the lead and the coding agents. Fixed provider, no fallbacks.
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL_2 || 'z-ai/glm-5.3-flash' }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL_2 }}             # optional (default z-ai/glm-5.3-flash)
          # 🆓 NVIDIA keys: bot 2's own (NVIDIA_KEY_2_1..3) if set, otherwise the same three as bot 1
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_KEY_2_1 || secrets.NVIDIA_KEY_1 }},${{ secrets.NVIDIA_KEY_2_2 || secrets.NVIDIA_KEY_2 }},${{ secrets.NVIDIA_KEY_2_3 || secrets.NVIDIA_KEY_3 }}
          GH_PAT: ${{ secrets.GH_PAT_2 || secrets.GH_PAT }}   # optional: lets the bot write/edit on GitHub and watch CI (owner only)
          TOR_PROXY: ${{ env.TOR_PROXY }}   # filled automatically when USE_TOR=true
          # A durable copy of the persona, rules and settings in this repo's Actions variables (BOT2_*),
          # so they survive even when the cache comes back empty. Needs GH_PAT with the repo scope.
          BOT_STATE_PREFIX: BOT2
          PERSONA_KEY: ${{ secrets.PERSONA_KEY_2 }}   # optional: the key that encrypts the persona and lock rules
        run: |
          mkdir -p data
          start=$(date +%s)
          timeout --signal=SIGINT 340m python bot.py || true
          # If it crashed quickly (e.g. a wrong key) don't restart right away — the schedule retries in 30 minutes
          if [ $(( $(date +%s) - start )) -gt 300 ]; then echo "restart=true" >> "$GITHUB_OUTPUT"; fi

      # Coding projects are saved too, without heavy dependency folders (they reinstall on demand)
      - name: Save data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            telegram-persona-bot/data
            !telegram-persona-bot/data/workspaces/**/node_modules
            !telegram-persona-bot/data/workspaces/**/.venv
            !telegram-persona-bot/data/workspaces/**/venv
            !telegram-persona-bot/data/workspaces/**/__pycache__
            !telegram-persona-bot/data/workspaces/**/.next
            !telegram-persona-bot/data/workspaces/**/target
          key: bot2-data-${{ github.run_id }}-${{ github.run_attempt }}

      # Keep the 3 newest data copies (a brand-new save isn't always visible right away, so the next run
      # can still fall back to the previous one); delete the older ones so wiped conversations go away
      - name: Delete old data
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: bot2-data-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          keys=$(gh cache list --key bot2-data- --limit 100 --sort created_at --order desc --json key --jq '.[].key')
          # If no new copy was saved, delete nothing (so the persona is never lost)
          echo "$keys" | grep -qx "$KEEP" || { echo "no new save, skipping"; exit 0; }
          echo "$keys" | tail -n +4 | while read -r k; do
            [ -n "$k" ] && [ "$k" != "$KEEP" ] && gh cache delete "$k" || true
          done

      - name: Restart
        if: steps.bot.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot2.yml --ref "${{ github.ref_name }}"
